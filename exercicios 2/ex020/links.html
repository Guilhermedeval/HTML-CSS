<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited {
            color: darkred;
        }
        a:hover {
            color: rgb(255, 0, 0);
            text-decoration:underline;
        }
        a:active {
            color: chocolate;
        }
        .especial {
            background-color: rgba(255, 0, 0, 0.541);
            
        }

        .especial::after {
            content: ' «';
            
        }
        .especial::before {
            content:' » ';
        }

    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://x.com/TioFells" target="_blank">Twitter Tio Fells</a></li>
        <li><a href="https://www.youtube.com/@TioFells" class="especial" target="_blank">Canal Tio Fells</a></li>
        <li><a href="https://www.instagram.com/caindoemsonhos/" class="especial" target="_blank">Caindo em Sonhos</a></li>
    </ul>
</body>
</html>
